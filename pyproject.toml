[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-sheet-ai"
version = "0.1.0"
description = "Analise explicavel de planilhas industriais com Python e IA"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
    "scikit-learn>=1.5,<2",
    "streamlit>=1.39,<2",
    "plotly>=5.24,<6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
